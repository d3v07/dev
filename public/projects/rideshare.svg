<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#grad1)"/>

  <!-- Car icon -->
  <g transform="translate(400, 200)">
    <path d="M80 200 L120 160 L240 160 L280 200 L320 200 L320 280 L300 280 L300 320 L260 320 L260 280 L100 280 L100 320 L60 320 L60 280 L40 280 L40 200 Z"
          fill="white" opacity="0.9"/>
    <circle cx="100" cy="300" r="20" fill="#1f2937"/>
    <circle cx="260" cy="300" r="20" fill="#1f2937"/>
    <rect x="140" y="180" width="80" height="60" fill="#60a5fa" opacity="0.7"/>
  </g>

  <!-- Route line -->
  <path d="M 200 400 Q 400 350, 600 400 T 1000 400"
        stroke="white" stroke-width="4" fill="none" stroke-dasharray="10,10" opacity="0.6"/>

  <!-- Location pins -->
  <g transform="translate(180, 370)">
    <path d="M20 0 C10 0 0 10 0 20 C0 35 20 60 20 60 C20 60 40 35 40 20 C40 10 30 0 20 0 Z"
          fill="white" opacity="0.9"/>
    <circle cx="20" cy="20" r="8" fill="#3b82f6"/>
  </g>

  <g transform="translate(980, 370)">
    <path d="M20 0 C10 0 0 10 0 20 C0 35 20 60 20 60 C20 60 40 35 40 20 C40 10 30 0 20 0 Z"
          fill="white" opacity="0.9"/>
    <circle cx="20" cy="20" r="8" fill="#8b5cf6"/>
  </g>

  <!-- Title -->
  <text x="600" y="550" font-family="Arial, sans-serif" font-size="48" font-weight="bold"
        fill="white" text-anchor="middle">Ride Share Platform</text>
  <text x="600" y="590" font-family="Arial, sans-serif" font-size="24"
        fill="white" opacity="0.9" text-anchor="middle">Real-time Matching • MERN Stack • Docker</text>
</svg>
