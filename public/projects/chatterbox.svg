<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#grad3)"/>

  <!-- Terminal window -->
  <g transform="translate(250, 120)">
    <!-- Window frame -->
    <rect x="0" y="0" width="700" height="400" rx="12" fill="#1f2937" opacity="0.95"/>

    <!-- Window controls -->
    <circle cx="25" cy="25" r="8" fill="#ef4444"/>
    <circle cx="55" cy="25" r="8" fill="#f59e0b"/>
    <circle cx="85" cy="25" r="8" fill="#10b981"/>

    <!-- Title bar -->
    <text x="350" y="32" font-family="monospace" font-size="16" fill="white" opacity="0.7" text-anchor="middle">
      ChatterBox - Terminal Chat
    </text>

    <!-- Terminal content -->
    <text x="30" y="80" font-family="monospace" font-size="18" fill="#10b981">
      $ ./chatterbox --server
    </text>
    <text x="30" y="115" font-family="monospace" font-size="16" fill="white" opacity="0.8">
      [INFO] Server started on port 8080
    </text>
    <text x="30" y="145" font-family="monospace" font-size="16" fill="#06b6d4" opacity="0.8">
      [INFO] User 'alice' connected
    </text>
    <text x="30" y="175" font-family="monospace" font-size="16" fill="#06b6d4" opacity="0.8">
      [INFO] User 'bob' connected
    </text>
    <text x="30" y="205" font-family="monospace" font-size="16" fill="white" opacity="0.8">
      alice: Hey everyone!
    </text>
    <text x="30" y="235" font-family="monospace" font-size="16" fill="white" opacity="0.8">
      bob: Hi alice! 👋
    </text>
    <text x="30" y="265" font-family="monospace" font-size="16" fill="#10b981" opacity="0.8">
      [INFO] 50+ users online
    </text>
    <text x="30" y="310" font-family="monospace" font-size="16" fill="white" opacity="0.6">
      > _
    </text>
  </g>

  <!-- Code brackets -->
  <text x="150" y="280" font-family="monospace" font-size="80" fill="white" opacity="0.15" font-weight="bold">{</text>
  <text x="1020" y="380" font-family="monospace" font-size="80" fill="white" opacity="0.15" font-weight="bold">}</text>

  <!-- Title -->
  <text x="600" y="570" font-family="Arial, sans-serif" font-size="48" font-weight="bold"
        fill="white" text-anchor="middle">ChatterBox</text>
  <text x="600" y="610" font-family="Arial, sans-serif" font-size="24"
        fill="white" opacity="0.9" text-anchor="middle">C++ • System V IPC • 50+ Concurrent Users</text>
</svg>
