<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#grad2)"/>

  <!-- Shield icon -->
  <g transform="translate(480, 150)">
    <path d="M120 20 L220 60 L220 160 C220 240 120 300 120 300 C120 300 20 240 20 160 L20 60 Z"
          fill="white" opacity="0.9" stroke="white" stroke-width="4"/>
    <path d="M120 80 L120 200 M80 140 L120 180 L160 120"
          stroke="#ef4444" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Network nodes -->
  <circle cx="250" cy="200" r="8" fill="white" opacity="0.7"/>
  <circle cx="350" cy="250" r="8" fill="white" opacity="0.7"/>
  <circle cx="950" cy="180" r="8" fill="white" opacity="0.7"/>
  <circle cx="850" cy="280" r="8" fill="white" opacity="0.7"/>

  <!-- Connection lines -->
  <line x1="250" y1="200" x2="480" y2="240" stroke="white" stroke-width="2" opacity="0.4"/>
  <line x1="350" y1="250" x2="480" y2="280" stroke="white" stroke-width="2" opacity="0.4"/>
  <line x1="720" y1="240" x2="950" y2="180" stroke="white" stroke-width="2" opacity="0.4"/>
  <line x1="720" y1="280" x2="850" y2="280" stroke="white" stroke-width="2" opacity="0.4"/>

  <!-- Data packets -->
  <rect x="300" y="350" width="60" height="40" rx="4" fill="white" opacity="0.3"/>
  <rect x="400" y="370" width="50" height="30" rx="4" fill="white" opacity="0.4"/>
  <rect x="750" y="350" width="70" height="45" rx="4" fill="white" opacity="0.3"/>
  <rect x="870" y="380" width="55" height="35" rx="4" fill="white" opacity="0.4"/>

  <!-- Title -->
  <text x="600" y="520" font-family="Arial, sans-serif" font-size="48" font-weight="bold"
        fill="white" text-anchor="middle">Cyber Threat Predictor</text>
  <text x="600" y="570" font-family="Arial, sans-serif" font-size="24"
        fill="white" opacity="0.9" text-anchor="middle">ML • 94.1% Accuracy • 2.1M Packets Processed</text>
</svg>
